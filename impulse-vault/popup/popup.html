<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IMPULSE VAULT</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="top">
      <div class="logo">
        <span class="logo-mark">◆</span>
        <span class="logo-name">IMPULSE&nbsp;VAULT</span>
      </div>
      <label class="pause" title="잠시 멈춤">
        <input type="checkbox" id="pauseToggle" />
        <span class="pause-track"><span class="pause-thumb"></span></span>
      </label>
    </header>

    <!-- Not-yet-onboarded notice -->
    <section id="needSetup" class="need-setup" hidden>
      <div class="vault-mini">🔒</div>
      <p>아직 설정이 끝나지 않았어요.</p>
      <button class="btn-primary" id="openOnboard">설정 시작하기</button>
    </section>

    <main id="main" hidden>
      <!-- Hero: Total Saved with the mini CSS vault -->
      <section class="hero">
        <div class="vault-visual" aria-hidden="true">
          <div class="vault-glow"></div>
          <div class="vault-dome"></div>
          <div class="vault-coin">₩</div>
        </div>
        <div class="saved-label">지금까지 아낀 돈</div>
        <div class="saved-amount" id="totalSaved">₩0</div>
        <div class="saved-meta">
          <span><b id="resisted">0</b> 번 참았어요</span>
          <span class="dot">·</span>
          <span>저항률 <b id="resistRate">0%</b></span>
        </div>
      </section>

      <!-- Snooze banner (only when snoozed) -->
      <div class="snooze-banner" id="snoozeBanner" hidden>
        오늘은 그만 묻는 중 — <button id="unsnooze">다시 켜기</button>
      </div>

      <!-- Vault items -->
      <section class="vault-list-section">
        <div class="section-head">
          <h2>금고</h2>
          <span class="count" id="vaultCount">0</span>
        </div>
        <div id="vaultList" class="vault-list"></div>
        <p class="empty" id="vaultEmpty">금고가 비어 있어요. 충동이 올 때 여기에 넣어두면 식혀줄게요. 🧊</p>
      </section>

      <footer class="foot">
        <button class="btn-ghost" id="openDash">대시보드 · 통계</button>
        <button class="btn-ghost small" id="openSettings">설정</button>
      </footer>
    </main>

    <script src="../utils/storage.js"></script>
    <script src="../utils/patterns.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
