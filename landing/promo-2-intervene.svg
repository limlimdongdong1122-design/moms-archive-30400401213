<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" font-family="'Space Grotesk','Inter',system-ui,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c0e13"/><stop offset="1" stop-color="#070809"/></linearGradient>
    <radialGradient id="aur" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#6ea8ff" stop-opacity="0.5"/><stop offset="1" stop-color="#6ea8ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c7d6f3"/></linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9cbff"/><stop offset="1" stop-color="#6ea8ff"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#000" flood-opacity="0.5"/></filter>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <circle cx="160" cy="140" r="300" fill="url(#aur)" filter="url(#soft)"/>
  <circle cx="1050" cy="640" r="280" fill="url(#aur)" filter="url(#soft)" opacity="0.7"/>

  <!-- brand -->
  <g transform="translate(64,56)">
    <g transform="rotate(45 11 11)"><rect width="22" height="22" rx="6" fill="url(#acc)"/></g>
    <text x="40" y="17" font-size="19" font-weight="700" letter-spacing="3" fill="#eef2f8">IMPULSE&#160;VAULT</text>
  </g>

  <!-- LEFT text -->
  <g transform="translate(72,250)">
    <text x="0" y="0" font-size="15" font-weight="600" letter-spacing="3" fill="#6ea8ff">THE INTERVENTION</text>
    <text x="-2" y="64" font-size="54" font-weight="700" letter-spacing="-1" fill="url(#ink)">It steps in right</text>
    <text x="-2" y="126" font-size="54" font-weight="700" letter-spacing="-1" fill="url(#ink)">at “Buy.”</text>
    <text x="0" y="186" font-size="23" fill="#aab3c4">Pros, cons &amp; the real cost — weighed 50:50.</text>
    <text x="0" y="218" font-size="23" fill="#aab3c4">It pauses you; it never blocks you.</text>
  </g>

  <!-- RIGHT: intervention modal -->
  <g transform="translate(688,150)" filter="url(#sh)">
    <rect width="448" height="450" rx="26" fill="#12151c" stroke="#ffffff" stroke-opacity="0.10"/>
    <rect width="448" height="450" rx="26" fill="url(#glass)"/>
    <rect x="30" y="30" width="92" height="28" rx="14" fill="#6ea8ff" fill-opacity="0.16" stroke="#6ea8ff" stroke-opacity="0.5"/>
    <text x="76" y="49" text-anchor="middle" font-size="13" font-weight="600" fill="#9cc2ff">Pause</text>
    <text x="30" y="100" font-size="28" font-weight="700" fill="#eef2f8">Do you really need this?</text>
    <text x="30" y="132" font-size="16" fill="#aab3c4">Wireless noise-cancelling earbuds</text>
    <text x="30" y="182" font-size="34" font-weight="700" fill="#fff">$149</text>
    <text x="124" y="182" font-size="15" fill="#8a93a4">≈ 3.2 hrs of work</text>
    <g transform="translate(30,214)" font-size="14.5">
      <text x="0" y="0" font-size="13" font-weight="700" letter-spacing="1" fill="#7fd6a6">PROS</text>
      <circle cx="6" cy="24" r="3.5" fill="#7fd6a6"/><text x="20" y="29" fill="#c4ccd8">Great noise-cancelling</text>
      <circle cx="6" cy="50" r="3.5" fill="#7fd6a6"/><text x="20" y="55" fill="#c4ccd8">Light, comfy fit</text>
    </g>
    <g transform="translate(244,214)" font-size="14.5">
      <text x="0" y="0" font-size="13" font-weight="700" letter-spacing="1" fill="#e0a17a">CONS</text>
      <circle cx="6" cy="24" r="3.5" fill="#e0a17a"/><text x="20" y="29" fill="#c4ccd8">You own one already</text>
      <circle cx="6" cy="50" r="3.5" fill="#e0a17a"/><text x="20" y="55" fill="#c4ccd8">Pricey for the type</text>
    </g>
    <rect x="30" y="300" width="388" height="44" rx="12" fill="#6ea8ff" fill-opacity="0.08"/>
    <text x="46" y="327" font-size="14" fill="#aab3c4"><tspan font-weight="700" fill="#cfe0ff">Verdict</tspan> · Vault it and cool off 24h</text>
    <rect x="30" y="362" width="232" height="52" rx="14" fill="url(#acc)"/>
    <text x="146" y="394" text-anchor="middle" font-size="16" font-weight="700" fill="#06101f">Vault it · 24h</text>
    <rect x="272" y="362" width="146" height="52" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="345" y="394" text-anchor="middle" font-size="16" font-weight="600" fill="#c4ccd8">Buy anyway</text>
  </g>
</svg>
