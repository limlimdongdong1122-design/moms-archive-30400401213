<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" font-family="'Space Grotesk','Inter',system-ui,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c0e13"/><stop offset="1" stop-color="#070809"/></linearGradient>
    <radialGradient id="aur" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#6ea8ff" stop-opacity="0.5"/><stop offset="1" stop-color="#6ea8ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c7d6f3"/></linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9cbff"/><stop offset="1" stop-color="#6ea8ff"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#000" flood-opacity="0.5"/></filter>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <circle cx="160" cy="140" r="300" fill="url(#aur)" filter="url(#soft)"/>
  <circle cx="1050" cy="640" r="280" fill="url(#aur)" filter="url(#soft)" opacity="0.7"/>

  <g transform="translate(64,56)">
    <g transform="rotate(45 11 11)"><rect width="22" height="22" rx="6" fill="url(#acc)"/></g>
    <text x="40" y="17" font-size="19" font-weight="700" letter-spacing="3" fill="#eef2f8">IMPULSE&#160;VAULT</text>
  </g>

  <g transform="translate(72,250)">
    <text x="0" y="0" font-size="15" font-weight="600" letter-spacing="3" fill="#6ea8ff">AI WEB SEARCH</text>
    <text x="-2" y="64" font-size="54" font-weight="700" letter-spacing="-1" fill="url(#ink)">Find a cheaper</text>
    <text x="-2" y="126" font-size="54" font-weight="700" letter-spacing="-1" fill="url(#ink)">or better option.</text>
    <text x="0" y="186" font-size="23" fill="#aab3c4">Optional AI searches the web for real</text>
    <text x="0" y="218" font-size="23" fill="#aab3c4">alternatives — with sources.</text>
  </g>

  <!-- RIGHT: alternatives card -->
  <g transform="translate(688,150)" filter="url(#sh)">
    <rect width="448" height="450" rx="26" fill="#12151c" stroke="#ffffff" stroke-opacity="0.10"/>
    <rect width="448" height="450" rx="26" fill="url(#glass)"/>
    <!-- header -->
    <circle cx="52" cy="56" r="16" fill="#6ea8ff" fill-opacity="0.16" stroke="#6ea8ff" stroke-opacity="0.5"/>
    <text x="52" y="61" text-anchor="middle" font-size="15">🔎</text>
    <text x="80" y="52" font-size="20" font-weight="700" fill="#eef2f8">Better alternatives</text>
    <text x="80" y="74" font-size="14" fill="#8a93a4">Found 3 cheaper picks · with reviews</text>

    <!-- rows -->
    <g transform="translate(30,104)">
      <!-- row 1 -->
      <rect x="0" y="0" width="388" height="86" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#6ea8ff" stroke-opacity="0.35"/>
      <text x="18" y="32" font-size="16" font-weight="600" fill="#eef2f8">Anker Soundcore P40i</text>
      <text x="18" y="58" font-size="13" fill="#8a93a4">4.5★ · 22k reviews · similar ANC</text>
      <text x="370" y="38" text-anchor="end" font-size="20" font-weight="700" fill="#7fd6a6">$59</text>
      <text x="370" y="60" text-anchor="end" font-size="12" fill="#7fd6a6">−60%</text>
      <!-- row 2 -->
      <rect x="0" y="98" width="388" height="86" rx="14" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.10"/>
      <text x="18" y="130" font-size="16" font-weight="600" fill="#eef2f8">Soundpeats Air4 Pro</text>
      <text x="18" y="156" font-size="13" fill="#8a93a4">4.4★ · 9k reviews · LDAC</text>
      <text x="370" y="136" text-anchor="end" font-size="20" font-weight="700" fill="#7fd6a6">$79</text>
      <text x="370" y="158" text-anchor="end" font-size="12" fill="#7fd6a6">−47%</text>
      <!-- row 3 -->
      <rect x="0" y="196" width="388" height="86" rx="14" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.10"/>
      <text x="18" y="228" font-size="16" font-weight="600" fill="#eef2f8">Your own pair (drawer)</text>
      <text x="18" y="254" font-size="13" fill="#8a93a4">You bought these 7 months ago</text>
      <text x="370" y="234" text-anchor="end" font-size="20" font-weight="700" fill="#9cc2ff">$0</text>
    </g>
    <text x="30" y="424" font-size="13" fill="#6b7484">Sources: amazon.com, rtings.com · via AI search</text>
  </g>
</svg>
