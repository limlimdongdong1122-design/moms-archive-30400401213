<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" font-family="'Space Grotesk','Inter',system-ui,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c0e13"/><stop offset="1" stop-color="#070809"/></linearGradient>
    <radialGradient id="aur" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#6ea8ff" stop-opacity="0.5"/><stop offset="1" stop-color="#6ea8ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c7d6f3"/></linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9cbff"/><stop offset="1" stop-color="#6ea8ff"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#000" flood-opacity="0.5"/></filter>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <circle cx="160" cy="140" r="300" fill="url(#aur)" filter="url(#soft)"/>
  <circle cx="1050" cy="640" r="280" fill="url(#aur)" filter="url(#soft)" opacity="0.7"/>

  <g transform="translate(64,56)">
    <g transform="rotate(45 11 11)"><rect width="22" height="22" rx="6" fill="url(#acc)"/></g>
    <text x="40" y="17" font-size="19" font-weight="700" letter-spacing="3" fill="#eef2f8">IMPULSE&#160;VAULT</text>
  </g>

  <g transform="translate(72,250)">
    <text x="0" y="0" font-size="15" font-weight="600" letter-spacing="3" fill="#6ea8ff">THE COOLING-OFF VAULT</text>
    <text x="-2" y="64" font-size="54" font-weight="700" letter-spacing="-1" fill="url(#ink)">Not sure?</text>
    <text x="-2" y="126" font-size="54" font-weight="700" letter-spacing="-1" fill="url(#ink)">Vault it for 24h.</text>
    <text x="0" y="186" font-size="23" fill="#aab3c4">Cool off. If you still want it tomorrow,</text>
    <text x="0" y="218" font-size="23" fill="#aab3c4">buy it then. Most urges fade.</text>
  </g>

  <!-- RIGHT: vault card with countdown ring -->
  <g transform="translate(712,170)" filter="url(#sh)">
    <rect width="424" height="410" rx="26" fill="#12151c" stroke="#ffffff" stroke-opacity="0.10"/>
    <rect width="424" height="410" rx="26" fill="url(#glass)"/>

    <!-- ring -->
    <g transform="translate(212,150)">
      <circle r="92" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="14"/>
      <!-- progress arc ~ 70% -->
      <circle r="92" fill="none" stroke="url(#acc)" stroke-width="14" stroke-linecap="round"
              stroke-dasharray="578" stroke-dashoffset="173" transform="rotate(-90)"/>
      <text x="0" y="-4" text-anchor="middle" font-size="34" font-weight="700" fill="#eef2f8">17:42</text>
      <text x="0" y="22" text-anchor="middle" font-size="13" fill="#8a93a4">left to decide</text>
    </g>

    <text x="212" y="300" text-anchor="middle" font-size="20" font-weight="700" fill="#eef2f8">Wireless earbuds</text>
    <text x="212" y="326" text-anchor="middle" font-size="16" fill="#9cc2ff">$149 · cooling off</text>

    <rect x="36" y="350" width="170" height="40" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="121" y="376" text-anchor="middle" font-size="14" font-weight="600" fill="#c4ccd8">Let it go</text>
    <rect x="218" y="350" width="170" height="40" rx="12" fill="#6ea8ff" fill-opacity="0.12" stroke="#6ea8ff" stroke-opacity="0.4"/>
    <text x="303" y="376" text-anchor="middle" font-size="14" font-weight="600" fill="#9cc2ff">Buy now</text>
  </g>

  <!-- floating saved chip -->
  <g transform="translate(700,150)">
    <rect x="-70" y="-22" width="150" height="44" rx="22" fill="#0c0e13" stroke="#6ea8ff" stroke-opacity="0.5"/>
    <text x="5" y="6" text-anchor="middle" font-size="17" font-weight="700" fill="#9cc2ff">$149 on hold</text>
  </g>
</svg>
