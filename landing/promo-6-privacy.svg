<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" font-family="'Space Grotesk','Inter',system-ui,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c0e13"/><stop offset="1" stop-color="#070809"/></linearGradient>
    <radialGradient id="aur" cx="0.5" cy="0.45" r="0.55"><stop offset="0" stop-color="#6ea8ff" stop-opacity="0.5"/><stop offset="1" stop-color="#6ea8ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c7d6f3"/></linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9cbff"/><stop offset="1" stop-color="#6ea8ff"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="msh" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="14" stdDeviation="26" flood-color="#6ea8ff" flood-opacity="0.5"/></filter>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <circle cx="600" cy="300" r="380" fill="url(#aur)" filter="url(#soft)"/>

  <g transform="translate(64,56)">
    <g transform="rotate(45 11 11)"><rect width="22" height="22" rx="6" fill="url(#acc)"/></g>
    <text x="40" y="17" font-size="19" font-weight="700" letter-spacing="3" fill="#eef2f8">IMPULSE&#160;VAULT</text>
  </g>

  <!-- centered shield -->
  <g transform="translate(600,250)" filter="url(#msh)">
    <path d="M0,-96 L78,-64 V6 C78,62 40,98 0,114 C-40,98 -78,62 -78,6 V-64 Z"
          fill="#10131b" stroke="url(#acc)" stroke-width="5"/>
    <rect x="-26" y="-8" width="52" height="42" rx="9" fill="none" stroke="url(#acc)" stroke-width="5"/>
    <path d="M-16,-8 V-22 a16,16 0 0 1 32,0 V-8" fill="none" stroke="url(#acc)" stroke-width="5"/>
    <circle cx="0" cy="11" r="6" fill="url(#acc)"/>
  </g>

  <text x="600" y="430" text-anchor="middle" font-size="56" font-weight="700" letter-spacing="-1" fill="url(#ink)">100% local. Zero data sent.</text>
  <text x="600" y="476" text-anchor="middle" font-size="23" fill="#aab3c4">No account. Nothing about you leaves the browser.</text>

  <!-- badges row -->
  <g transform="translate(600,540)" font-size="18" font-weight="600">
    <g transform="translate(-348,0)">
      <rect x="0" y="0" width="220" height="52" rx="26" fill="url(#glass)" stroke="#6ea8ff" stroke-opacity="0.45"/>
      <text x="110" y="33" text-anchor="middle" fill="#cfe0ff">🔒 0 requests with your data</text>
    </g>
    <g transform="translate(-110,0)">
      <rect x="0" y="0" width="120" height="52" rx="26" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="60" y="33" text-anchor="middle" fill="#d7dee9">No sign-up</text>
    </g>
    <g transform="translate(28,0)">
      <rect x="0" y="0" width="320" height="52" rx="26" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="160" y="33" text-anchor="middle" fill="#d7dee9">Free · Chrome · Edge · Brave · EN/한</text>
    </g>
  </g>

  <text x="600" y="648" text-anchor="middle" font-size="15" fill="#6b7484">AI analysis is opt-in and goes only to the provider you choose.</text>
</svg>
