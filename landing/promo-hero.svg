<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" font-family="'Space Grotesk','Inter',system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0e13"/><stop offset="1" stop-color="#070809"/>
    </linearGradient>
    <radialGradient id="auroraB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6ea8ff" stop-opacity="0.55"/><stop offset="1" stop-color="#6ea8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraP" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b7bf0" stop-opacity="0.4"/><stop offset="1" stop-color="#8b7bf0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="headline" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c7d6f3"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9cbff"/><stop offset="1" stop-color="#6ea8ff"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="750" fill="url(#bg)"/>
  <circle cx="180" cy="120" r="320" fill="url(#auroraB)" filter="url(#soft)"/>
  <circle cx="1040" cy="660" r="300" fill="url(#auroraP)" filter="url(#soft)"/>
  <rect width="1200" height="750" fill="none"/>

  <!-- brand -->
  <g transform="translate(64,60)">
    <g transform="rotate(45 11 11)">
      <rect x="0" y="0" width="22" height="22" rx="6" fill="url(#accent)"/>
    </g>
    <text x="40" y="17" font-size="20" font-weight="700" letter-spacing="3" fill="#eef2f8">IMPULSE&#160;VAULT</text>
  </g>

  <!-- LEFT: text -->
  <g transform="translate(64,176)">
    <text x="0" y="0" font-size="15" font-weight="600" letter-spacing="3" fill="#6ea8ff">BROWSER EXTENSION · 100% LOCAL · FREE</text>
    <text x="-2" y="78" font-size="62" font-weight="700" letter-spacing="-1.5" fill="url(#headline)">Before you buy,</text>
    <text x="-2" y="150" font-size="62" font-weight="700" letter-spacing="-1.5" fill="url(#headline)">just one more moment.</text>
    <text x="0" y="210" font-size="23" fill="#aab3c4">The instant you hit “buy,” IMPULSE VAULT steps in with</text>
    <text x="0" y="242" font-size="23" fill="#aab3c4">the pros, cons &amp; cheaper alternatives — then you decide.</text>

    <!-- badges -->
    <g transform="translate(0,286)" font-size="16" font-weight="600">
      <g>
        <rect x="0" y="0" width="92" height="40" rx="20" fill="url(#glass)" stroke="#6ea8ff" stroke-opacity="0.5"/>
        <text x="46" y="26" text-anchor="middle" fill="#cfe0ff">Free</text>
      </g>
      <g transform="translate(104,0)">
        <rect x="0" y="0" width="150" height="40" rx="20" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.14"/>
        <text x="75" y="26" text-anchor="middle" fill="#d7dee9">🔒 100% local</text>
      </g>
      <g transform="translate(266,0)">
        <rect x="0" y="0" width="220" height="40" rx="20" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.14"/>
        <text x="110" y="26" text-anchor="middle" fill="#d7dee9">Chrome · Edge · Brave</text>
      </g>
    </g>
  </g>

  <!-- RIGHT: mini intervention card -->
  <g transform="translate(720,150)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="416" height="448" rx="26" fill="#12151c" stroke="#ffffff" stroke-opacity="0.10"/>
    <rect x="0" y="0" width="416" height="448" rx="26" fill="url(#glass)"/>
    <!-- badge -->
    <rect x="28" y="30" width="92" height="28" rx="14" fill="#6ea8ff" fill-opacity="0.16" stroke="#6ea8ff" stroke-opacity="0.5"/>
    <text x="74" y="49" text-anchor="middle" font-size="13" font-weight="600" fill="#9cc2ff">Pause</text>
    <!-- title -->
    <text x="28" y="98" font-size="27" font-weight="700" fill="#eef2f8">Do you really need this?</text>
    <text x="28" y="130" font-size="16" fill="#aab3c4">Wireless noise-cancelling earbuds</text>
    <!-- price reframe -->
    <text x="28" y="178" font-size="34" font-weight="700" fill="#ffffff">$149</text>
    <text x="120" y="178" font-size="15" fill="#8a93a4">≈ 3.2 hrs of work</text>

    <!-- pros / cons -->
    <g transform="translate(28,210)" font-size="14.5">
      <text x="0" y="0" font-size="13" font-weight="700" letter-spacing="1" fill="#7fd6a6">PROS</text>
      <circle cx="6" cy="24" r="3.5" fill="#7fd6a6"/><text x="20" y="29" fill="#c4ccd8">Great noise-cancelling reviews</text>
      <circle cx="6" cy="50" r="3.5" fill="#7fd6a6"/><text x="20" y="55" fill="#c4ccd8">Light, comfy fit</text>
    </g>
    <g transform="translate(228,210)" font-size="14.5">
      <text x="0" y="0" font-size="13" font-weight="700" letter-spacing="1" fill="#e0a17a">CONS</text>
      <circle cx="6" cy="24" r="3.5" fill="#e0a17a"/><text x="20" y="29" fill="#c4ccd8">You own something similar</text>
      <circle cx="6" cy="50" r="3.5" fill="#e0a17a"/><text x="20" y="55" fill="#c4ccd8">On the pricier side</text>
    </g>

    <!-- verdict -->
    <rect x="28" y="296" width="360" height="44" rx="12" fill="#6ea8ff" fill-opacity="0.08"/>
    <text x="44" y="323" font-size="14" fill="#aab3c4"><tspan font-weight="700" fill="#cfe0ff">Verdict</tspan> · Vault it and cool off 24h</text>

    <!-- buttons -->
    <rect x="28" y="360" width="220" height="52" rx="14" fill="url(#accent)"/>
    <text x="138" y="392" text-anchor="middle" font-size="16" font-weight="700" fill="#06101f">Vault it · 24h</text>
    <rect x="258" y="360" width="130" height="52" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="323" y="392" text-anchor="middle" font-size="16" font-weight="600" fill="#c4ccd8">Not now</text>
  </g>

  <!-- saved chip -->
  <g transform="translate(1016,120)">
    <rect x="-86" y="-26" width="172" height="52" rx="26" fill="#0c0e13" stroke="#6ea8ff" stroke-opacity="0.5"/>
    <text x="0" y="7" text-anchor="middle" font-size="20" font-weight="700" fill="#9cc2ff">+ $149 saved</text>
  </g>
</svg>
