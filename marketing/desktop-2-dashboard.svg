<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="'Space Grotesk','Inter',system-ui,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c0e13"/><stop offset="1" stop-color="#070809"/></linearGradient>
    <radialGradient id="aur" cx="0.5" cy="0.4" r="0.5"><stop offset="0" stop-color="#6ea8ff" stop-opacity="0.4"/><stop offset="1" stop-color="#6ea8ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9cbff"/><stop offset="1" stop-color="#6ea8ff"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eafff7"/><stop offset="0.5" stop-color="#8ff0cf"/><stop offset="1" stop-color="#6ea8ff"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="80"/></filter>
  </defs>

  <!-- browser chrome -->
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="84" fill="#101319"/>
  <circle cx="44" cy="42" r="12" fill="#ff5f57"/><circle cx="82" cy="42" r="12" fill="#febc2e"/><circle cx="120" cy="42" r="12" fill="#28c840"/>
  <rect x="190" y="20" width="420" height="64" rx="12" fill="#0c0e13"/>
  <text x="220" y="60" font-size="24" fill="#aab3c4">IMPULSE VAULT — Dashboard</text>

  <circle cx="1500" cy="520" r="460" fill="url(#aur)" filter="url(#soft)"/>

  <!-- sidebar -->
  <rect x="0" y="84" width="320" height="996" fill="#0e1218"/>
  <g transform="translate(40,150)">
    <g transform="rotate(45 11 11)"><rect width="22" height="22" rx="6" fill="url(#acc)"/></g>
    <text x="42" y="17" font-size="20" font-weight="700" letter-spacing="2" fill="#eef2f8">IMPULSE&#160;VAULT</text>
  </g>
  <g font-size="26" fill="#8a93a8">
    <rect x="32" y="240" width="256" height="60" rx="14" fill="#6ea8ff" fill-opacity="0.12" stroke="#6ea8ff" stroke-opacity="0.3"/>
    <text x="64" y="279" fill="#dbe6fb">Overview</text>
    <text x="64" y="359">Impulse profile</text>
    <text x="64" y="429">Vault</text>
    <text x="64" y="499">Settings</text>
    <text x="64" y="569" fill="#9cc2ff">Pro Membership</text>
    <text x="64" y="639">My Data · Privacy</text>
  </g>

  <!-- main: title -->
  <text x="376" y="190" font-size="48" font-weight="800" fill="#eef2f8">Overview</text>

  <!-- Total saved big -->
  <g>
    <rect x="376" y="240" width="900" height="240" rx="28" fill="#12151c" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="376" y="240" width="900" height="240" rx="28" fill="url(#glass)"/>
    <text x="420" y="320" font-size="26" font-weight="700" letter-spacing="3" fill="#8a93a4">TOTAL SAVED</text>
    <text x="420" y="430" font-size="110" font-weight="800" fill="url(#mint)">$1,240</text>
    <text x="1080" y="430" font-size="34" font-weight="700" fill="#7fd6a6">▲ this month</text>
  </g>

  <!-- two small stats -->
