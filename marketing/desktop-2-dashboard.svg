    <rect x="1300" y="240" width="544" height="113" rx="24" fill="#12151c" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="1336" y="300" font-size="22" font-weight="700" letter-spacing="2" fill="#8a93a4">RESISTED</text>
    <text x="1700" y="322" font-size="56" font-weight="800" fill="#eef2f8">37</text>
