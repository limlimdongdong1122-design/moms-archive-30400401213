<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" font-family="'Inter','Space Grotesk',system-ui,sans-serif">
  <defs>
    <linearGradient id="scene" x1="0" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="#0e1118"/><stop offset="1" stop-color="#070809"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55"><stop offset="0" stop-color="#6ea8ff" stop-opacity="0.4"/><stop offset="1" stop-color="#6ea8ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7f9fc"/><stop offset="1" stop-color="#eef1f7"/></linearGradient>
    <linearGradient id="prod" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cfe0ff"/><stop offset="1" stop-color="#9bb6e6"/></linearGradient>
    <linearGradient id="buy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fb0ff"/><stop offset="1" stop-color="#3f6fe0"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a2e38"/><stop offset="1" stop-color="#15171d"/></linearGradient>
    <clipPath id="scr"><rect x="276" y="318" width="528" height="1284" rx="58"/></clipPath>
    <filter id="dsh" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="40" stdDeviation="50" flood-color="#000" flood-opacity="0.6"/></filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#scene)"/>
  <circle cx="540" cy="820" r="560" fill="url(#glow)"/>

  <!-- phone body -->
  <g filter="url(#dsh)">
    <rect x="250" y="292" width="580" height="1336" rx="92" fill="url(#body)"/>
    <rect x="262" y="304" width="556" height="1312" rx="82" fill="#0b0d12"/>
  </g>

  <!-- screen -->
  <g clip-path="url(#scr)">
    <rect x="276" y="318" width="528" height="1284" fill="url(#pg)"/>

    <!-- status -->
    <text x="312" y="372" font-size="22" font-weight="700" fill="#1a2030">9:41</text>
    <!-- title -->
    <text x="540" y="446" text-anchor="middle" font-size="32" font-weight="800" fill="#161b29">Checkout</text>

    <!-- order item -->
    <text x="312" y="528" font-size="18" font-weight="700" letter-spacing="1.5" fill="#8a93a8">YOUR ORDER</text>
    <rect x="312" y="548" width="456" height="130" rx="20" fill="#ffffff"/>
    <rect x="336" y="572" width="82" height="82" rx="16" fill="#eef3fb"/>
    <g transform="translate(377,613) scale(0.42)">
      <rect x="-70" y="-16" width="34" height="100" rx="17" fill="url(#prod)"/><ellipse cx="-53" cy="-22" rx="42" ry="46" fill="url(#prod)"/>
      <rect x="36" y="-16" width="34" height="100" rx="17" fill="url(#prod)"/><ellipse cx="53" cy="-22" rx="42" ry="46" fill="url(#prod)"/>
    </g>
    <text x="440" y="604" font-size="24" font-weight="700" fill="#161b29">Wireless Earbuds Pro</text>
    <text x="440" y="640" font-size="20" fill="#8a93a8">Qty 1 · Black</text>
    <text x="744" y="622" text-anchor="end" font-size="26" font-weight="800" fill="#161b29">$149</text>

    <!-- payment -->
    <text x="312" y="752" font-size="18" font-weight="700" letter-spacing="1.5" fill="#8a93a8">PAYMENT</text>
    <rect x="312" y="772" width="456" height="96" rx="20" fill="#ffffff"/>
    <rect x="336" y="804" width="56" height="36" rx="6" fill="url(#buy)"/>
    <text x="408" y="834" font-size="22" font-weight="600" fill="#161b29">Card ···· 4242</text>

    <!-- summary -->
    <line x1="312" y1="940" x2="768" y2="940" stroke="#dfe4ee" stroke-width="2"/>
    <text x="312" y="996" font-size="22" fill="#8a93a8">Subtotal</text><text x="768" y="996" text-anchor="end" font-size="22" fill="#48506a">$149</text>
    <text x="312" y="1040" font-size="22" fill="#8a93a8">Delivery</text><text x="768" y="1040" text-anchor="end" font-size="22" fill="#48506a">Free</text>
    <text x="312" y="1110" font-size="30" font-weight="800" fill="#161b29">Total</text><text x="768" y="1110" text-anchor="end" font-size="34" font-weight="800" fill="#161b29">$149</text>

    <!-- PAY button -->
    <rect x="312" y="1430" width="456" height="104" rx="30" fill="url(#buy)"/>
    <text x="540" y="1496" text-anchor="middle" font-size="36" font-weight="800" fill="#ffffff">Pay $149</text>
    <circle cx="540" cy="1482" r="78" fill="#ffffff" opacity="0.16"/>

    <!-- finger -->
    <g transform="translate(600,1452) scale(0.7)">
      <path d="M0,120 C-6,70 -6,40 8,18 C16,4 34,8 34,28 L34,60 L40,18 C42,2 64,4 62,24 L60,64 L70,40 C74,26 92,30 88,50 L82,96 C78,140 60,168 24,168 C6,168 -4,150 -8,132 Z" fill="#f1d3b6" stroke="#d9b48f" stroke-width="3"/>
    </g>
  </g>

  <!-- dynamic island -->
  <rect x="476" y="346" width="128" height="36" rx="18" fill="#000000"/>
</svg>
