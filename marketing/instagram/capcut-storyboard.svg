<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1200" font-family="'Space Grotesk','Segoe UI',system-ui,sans-serif">
<defs>
<linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c1118"/><stop offset="1" stop-color="#10161f"/></linearGradient>
<linearGradient id="fr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0e14"/><stop offset="1" stop-color="#0c121b"/></linearGradient>
<linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9cbff"/><stop offset="1" stop-color="#6ea8ff"/></linearGradient>
<linearGradient id="amb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd9a8"/><stop offset="1" stop-color="#ffb454"/></linearGradient>
</defs>
<rect width="1680" height="1200" fill="url(#pg)"/>
<text x="80" y="56" fill="#eaf1fb" font-size="32" font-weight="700">IMPULSE VAULT — 15s Ad · CapCut Storyboard</text>
<text x="80" y="86" fill="#9fb0c6" font-size="16" font-family="'Inter',sans-serif">9:16 · 1080×1920 · 30fps · all px values below assume a 1080×1920 canvas · text = CapCut native (always crisp)</text>

<!-- ===== S1 thumbnail ===== -->
<g transform="translate(80,118)">
  <text x="0" y="-6" fill="#a9cbff" font-size="17" font-weight="700">S1 · 0.0–3.0s · HOOK</text>
  <rect x="0" y="4" width="300" height="500" rx="24" fill="url(#fr)" stroke="rgba(255,255,255,0.12)"/>
  <text x="150" y="238" fill="#eaf1fb" font-size="27" font-weight="700" text-anchor="middle">About to buy…</text>
  <text x="150" y="296" fill="#ffb454" font-size="40" font-weight="700" text-anchor="middle">again?</text>
</g>
<g transform="translate(80,648)" font-family="'Inter',sans-serif" font-size="13" fill="#9fb0c6">
  <text x="0" y="0"><tspan fill="#eaf1fb" font-weight="600">BG:</tspan> solid #0A0E14</text>
  <text x="0" y="24"><tspan fill="#eaf1fb" font-weight="600">L1 text:</tspan> "About to buy…"</text>
  <text x="14" y="44">Space Grotesk Bold · 70px · #EAF1FB · y44%</text>
  <text x="0" y="68"><tspan fill="#eaf1fb" font-weight="600">L2 text:</tspan> "again?" · 96px · #FFB454</text>
  <text x="14" y="88">center · y53% · appears @0.9s</text>
  <text x="0" y="112"><tspan fill="#eaf1fb" font-weight="600">Anim:</tspan> Fade-in 0.3s (no scale);</text>
  <text x="14" y="132">Fade-out 0.2s @2.8s</text>
  <text x="0" y="156"><tspan fill="#eaf1fb" font-weight="600">SFX:</tspan> UI click @0.2s · BGM (tension) in</text>
  <text x="0" y="180"><tspan fill="#eaf1fb" font-weight="600">CC:</tspan> About to buy… again?</text>
</g>

<!-- ===== S2 thumbnail ===== -->
<g transform="translate(487,118)">
  <text x="0" y="-6" fill="#a9cbff" font-size="17" font-weight="700">S2 · 3.0–7.0s · REFRAME ⭐</text>
  <rect x="0" y="4" width="300" height="500" rx="24" fill="url(#fr)" stroke="rgba(255,255,255,0.12)"/>
