  <line x1="86" y1="166" x2="214" y2="166" stroke="#ff6b6b" stroke-width="6" stroke-linecap="round"/>
  <text x="150" y="300" fill="url(#amb)" font-size="54" font-weight="700" text-anchor="middle">13 HOURS</text>
  <text x="150" y="348" fill="#eaf1fb" font-size="22" font-weight="700" text-anchor="middle">of your life. ⏳</text>
</g>
<g transform="translate(487,648)" font-family="'Inter',sans-serif" font-size="13" fill="#9fb0c6">
  <text x="0" y="0"><tspan fill="#eaf1fb" font-weight="600">L1:</tspan> "$199" · Bold · 80px · #9FB0C6 · y30%</text>
  <text x="0" y="24"><tspan fill="#eaf1fb" font-weight="600">L2:</tspan> strike line · #FF6B6B · 8px</text>
  <text x="14" y="44">wipe L→R 0.25s · @3.6s</text>
  <text x="0" y="68"><tspan fill="#eaf1fb" font-weight="600">L3:</tspan> "13 HOURS" · Bold · 150px · #FFB454</text>
