<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1020" font-family="'Space Grotesk','Segoe UI',system-ui,sans-serif">
<defs>
<linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c1118"/><stop offset="1" stop-color="#10161f"/></linearGradient>
<linearGradient id="fr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0e14"/><stop offset="1" stop-color="#0c121b"/></linearGradient>
<linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9cbff"/><stop offset="1" stop-color="#6ea8ff"/></linearGradient>
<linearGradient id="amb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd9a8"/><stop offset="1" stop-color="#ffb454"/></linearGradient>
</defs>
<rect width="1680" height="1020" fill="url(#pg)"/>
<!-- title -->
<text x="80" y="58" fill="#eaf1fb" font-size="34" font-weight="700">15-SEC AD STORYBOARD</text>
<text x="80" y="90" fill="#9fb0c6" font-size="18" font-family="'Inter',sans-serif">IMPULSE VAULT · build in CapCut · 9:16 (1080×1920) · text = CapCut native (sharp) · images ≤100% (no blur)</text>
<text x="1600" y="74" fill="#6ea8ff" font-size="16" text-anchor="end" font-family="'Inter',sans-serif">→ flow</text>

<!-- ============ frame template via groups ============ -->
<!-- S1 -->
<g transform="translate(80,128)">
  <text x="0" y="-8" fill="#a9cbff" font-size="18" font-weight="700">S1 · 0.0–3.0s — HOOK</text>
  <rect x="0" y="6" width="320" height="569" rx="26" fill="url(#fr)" stroke="rgba(255,255,255,0.12)"/>
  <text x="160" y="270" fill="#eaf1fb" font-size="30" font-weight="700" text-anchor="middle">About to buy…</text>
  <text x="160" y="330" fill="#ffb454" font-size="44" font-weight="700" text-anchor="middle">again?</text>
  <text x="160" y="540" fill="#6c7c93" font-size="14" text-anchor="middle" font-family="'Inter',sans-serif">CC: About to buy… again?</text>
  <!-- notes -->
  <g font-family="'Inter',sans-serif" font-size="14" fill="#9fb0c6">
    <text x="0" y="616"><tspan fill="#eaf1fb" font-weight="600">Text:</tspan> "About to buy…" → "again?"(amber)</text>
    <text x="0" y="642"><tspan fill="#eaf1fb" font-weight="600">Anim:</tspan> Fade only (no scale)</text>
    <text x="0" y="668"><tspan fill="#eaf1fb" font-weight="600">SFX:</tspan> soft click · tension BGM in</text>
  </g>
</g>

<!-- S2 -->
<g transform="translate(480,128)">
  <text x="0" y="-8" fill="#a9cbff" font-size="18" font-weight="700">S2 · 3.0–7.0s — REFRAME ⭐</text>
  <rect x="0" y="6" width="320" height="569" rx="26" fill="url(#fr)" stroke="rgba(255,255,255,0.12)"/>
  <text x="160" y="210" fill="#9fb0c6" font-size="46" font-weight="700" text-anchor="middle">$199</text>
  <line x1="92" y1="196" x2="228" y2="196" stroke="#ff6b6b" stroke-width="6" stroke-linecap="round"/>
  <text x="160" y="330" fill="url(#amb)" font-size="58" font-weight="700" text-anchor="middle">13 HOURS</text>
  <text x="160" y="380" fill="#eaf1fb" font-size="24" font-weight="700" text-anchor="middle">of your life. ⏳</text>
  <text x="160" y="540" fill="#6c7c93" font-size="13" text-anchor="middle" font-family="'Inter',sans-serif">CC: That $199 'treat'? 13 hrs of your life.</text>
  <g font-family="'Inter',sans-serif" font-size="14" fill="#9fb0c6">
    <text x="0" y="616"><tspan fill="#eaf1fb" font-weight="600">Text:</tspan> $199(strike) → 13 HOURS(amber)</text>
    <text x="0" y="642"><tspan fill="#eaf1fb" font-weight="600">Anim:</tspan> Fade + slide-up 20px</text>
    <text x="0" y="668"><tspan fill="#eaf1fb" font-weight="600">SFX:</tspan> impact "boom" on 13 HOURS</text>
  </g>
</g>

<!-- S3 -->
<g transform="translate(880,128)">
  <text x="0" y="-8" fill="#a9cbff" font-size="18" font-weight="700">S3 · 7.0–11.5s — SOLUTION</text>
  <rect x="0" y="6" width="320" height="569" rx="26" fill="url(#fr)" stroke="rgba(255,255,255,0.12)"/>
  <!-- mini pause card -->
  <g transform="translate(30,150)">
    <rect x="0" y="0" width="260" height="210" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
    <text x="18" y="34" fill="#ffb454" font-size="11" font-weight="600" letter-spacing="1">⏸ HOLD ON A SECOND</text>
    <text x="18" y="64" fill="#eaf1fb" font-size="17" font-weight="700">Wireless Headphones</text>
    <text x="18" y="98" fill="#ffffff" font-size="26" font-weight="700">$199</text>
    <rect x="18" y="118" width="224" height="38" rx="9" fill="rgba(255,180,84,0.10)" stroke="rgba(255,180,84,0.25)"/>
    <text x="30" y="142" fill="#ffd9a8" font-size="12">⏳ ≈ 13 hours of work. Worth it?</text>
    <rect x="18" y="164" width="108" height="34" rx="9" fill="rgba(110,168,255,0.16)" stroke="rgba(110,168,255,0.4)"/>
    <text x="72" y="186" fill="#a9cbff" font-size="13" font-weight="600" text-anchor="middle">🧊 Vault it</text>
    <rect x="134" y="164" width="108" height="34" rx="9" fill="none" stroke="rgba(255,255,255,0.12)"/>
    <text x="188" y="186" fill="#6c7c93" font-size="13" font-weight="600" text-anchor="middle">Buy anyway</text>
  </g>
  <text x="160" y="430" fill="#cdd9ee" font-size="17" font-weight="600" text-anchor="middle">Pauses you —</text>
  <text x="160" y="456" fill="#cdd9ee" font-size="17" font-weight="600" text-anchor="middle">right at checkout.</text>
  <text x="160" y="540" fill="#6c7c93" font-size="13" text-anchor="middle" font-family="'Inter',sans-serif">CC: IMPULSE VAULT pauses you at checkout.</text>
  <g font-family="'Inter',sans-serif" font-size="14" fill="#9fb0c6">
    <text x="0" y="616"><tspan fill="#eaf1fb" font-weight="600">Visual:</tspan> card slides up (move only, ≤100%)</text>
    <text x="0" y="642"><tspan fill="#eaf1fb" font-weight="600">Transition:</tspan> Mix / hard cut (no Blur)</text>
    <text x="0" y="668"><tspan fill="#eaf1fb" font-weight="600">SFX:</tspan> soft "ding"</text>
  </g>
</g>

<!-- S4 -->
<g transform="translate(1280,128)">
  <text x="0" y="-8" fill="#a9cbff" font-size="18" font-weight="700">S4 · 11.5–15.0s — CTA</text>
  <rect x="0" y="6" width="320" height="569" rx="26" fill="url(#fr)" stroke="rgba(255,255,255,0.12)"/>
  <!-- logo -->
  <g transform="translate(160,170)">
    <rect x="-34" y="-34" width="68" height="68" rx="18" fill="url(#tile)"/>
    <circle cx="0" cy="0" r="22" fill="#0a1424"/>
    <circle cx="0" cy="0" r="16" fill="none" stroke="#7fb0ff" stroke-width="3"/>
    <line x1="0" y1="0" x2="11" y2="-11" stroke="#a9cbff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="4" fill="#a9cbff"/>
  </g>
  <text x="160" y="250" fill="#eaf1fb" font-size="22" font-weight="700" letter-spacing="2" text-anchor="middle">IMPULSE VAULT</text>
  <rect x="40" y="288" width="240" height="54" rx="13" fill="url(#tile)"/>
  <text x="160" y="322" fill="#06101f" font-size="17" font-weight="700" text-anchor="middle">Add to your browser — Free</text>
  <text x="160" y="382" fill="#eaf3ff" font-size="20" font-weight="700" text-anchor="middle">impursivevault.com</text>
  <text x="160" y="416" fill="#9fb0c6" font-size="14" text-anchor="middle" font-family="'Inter',sans-serif">🔒 100% local · no account</text>
  <text x="160" y="540" fill="#6c7c93" font-size="13" text-anchor="middle" font-family="'Inter',sans-serif">CC: Free · 100% local → impursivevault.com</text>
  <g font-family="'Inter',sans-serif" font-size="14" fill="#9fb0c6">
    <text x="0" y="616"><tspan fill="#eaf1fb" font-weight="600">Anim:</tspan> logo fade → button pop(0.9→1.0)</text>
    <text x="0" y="642"><tspan fill="#eaf1fb" font-weight="600">Glow:</tspan> OFF on URL (keep crisp)</text>
    <text x="0" y="668"><tspan fill="#eaf1fb" font-weight="600">SFX:</tspan> chime · BGM resolve</text>
  </g>
</g>

<!-- bottom: palette + export -->
<g transform="translate(80,840)">
  <text x="0" y="0" fill="#eaf1fb" font-size="18" font-weight="700">PALETTE</text>
  <g font-family="'Inter',sans-serif" font-size="13" fill="#9fb0c6">
    <rect x="0" y="16" width="26" height="26" rx="6" fill="#0a0e14" stroke="#333"/><text x="34" y="34">#0A0E14 bg</text>
    <rect x="150" y="16" width="26" height="26" rx="6" fill="#6ea8ff"/><text x="184" y="34">#6EA8FF accent</text>
    <rect x="330" y="16" width="26" height="26" rx="6" fill="#ffb454"/><text x="364" y="34">#FFB454 amber</text>
    <rect x="500" y="16" width="26" height="26" rx="6" fill="#ff6b6b"/><text x="534" y="34">#FF6B6B strike</text>
    <rect x="660" y="16" width="26" height="26" rx="6" fill="#eaf1fb"/><text x="694" y="34">#EAF1FB text</text>
  </g>
  <text x="900" y="0" fill="#eaf1fb" font-size="18" font-weight="700">EXPORT (sharp)</text>
  <text x="900" y="34" fill="#9fb0c6" font-size="13" font-family="'Inter',sans-serif">1080×1920 · 30fps · bitrate HIGH · H.264/MP4 · Enhance/HDR OFF</text>
  <text x="900" y="62" fill="#ffb454" font-size="13" font-family="'Inter',sans-serif">No "Blur/Glow/Zoom-blur" transitions · images ≤100% · text = CapCut native</text>
</g>
</svg>
