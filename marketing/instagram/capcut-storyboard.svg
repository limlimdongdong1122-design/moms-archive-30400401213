  <text x="0" y="136"><tspan fill="#eaf1fb" font-weight="600">SFX:</tspan> impact "boom" @3.9s</text>
  <text x="0" y="160"><tspan fill="#eaf1fb" font-weight="600">CC:</tspan> That $199 'treat'? It's 13 hours</text>
  <text x="14" y="180">of your life.</text>
</g>

<!-- ===== S3 thumbnail ===== -->
<g transform="translate(894,118)">
  <text x="0" y="-6" fill="#a9cbff" font-size="17" font-weight="700">S3 · 7.0–11.5s · SOLUTION</text>
