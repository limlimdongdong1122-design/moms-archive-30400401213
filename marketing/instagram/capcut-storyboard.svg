    <text x="18" y="60" fill="#eaf1fb" font-size="16" font-weight="700">Wireless Headphones</text>
    <text x="18" y="92" fill="#ffffff" font-size="24" font-weight="700">$199</text>
    <rect x="18" y="112" width="214" height="36" rx="9" fill="rgba(255,180,84,0.10)" stroke="rgba(255,180,84,0.25)"/>
    <text x="30" y="135" fill="#ffd9a8" font-size="11.5">⏳ ≈ 13 hours of work. Worth it?</text>
    <rect x="18" y="158" width="103" height="34" rx="9" fill="rgba(110,168,255,0.16)" stroke="rgba(110,168,255,0.4)"/>
    <text x="69" y="180" fill="#a9cbff" font-size="12.5" font-weight="600" text-anchor="middle">🧊 Vault it</text>
    <rect x="129" y="158" width="103" height="34" rx="9" fill="none" stroke="rgba(255,255,255,0.12)"/>
    <text x="180" y="180" fill="#6c7c93" font-size="12.5" font-weight="600" text-anchor="middle">Buy anyway</text>
  </g>
  <text x="150" y="404" fill="#cdd9ee" font-size="16" font-weight="600" text-anchor="middle">Pauses you — right</text>
  <text x="150" y="428" fill="#cdd9ee" font-size="16" font-weight="600" text-anchor="middle">at checkout.</text>
</g>
<g transform="translate(894,648)" font-family="'Inter',sans-serif" font-size="13" fill="#9fb0c6">
  <text x="0" y="0"><tspan fill="#eaf1fb" font-weight="600">Transition in:</tspan> Mix/dissolve 0.3s</text>
  <text x="14" y="20">(NOT a Blur transition)</text>
  <text x="0" y="44"><tspan fill="#eaf1fb" font-weight="600">Element:</tspan> pause-card PNG (≤100%)</text>
  <text x="14" y="64">center · slide-up 40px in 0.4s @7.1s</text>
  <text x="0" y="88"><tspan fill="#eaf1fb" font-weight="600">Text:</tspan> "IMPULSE VAULT pauses you —</text>
  <text x="14" y="108">right at checkout." · 40px · #CDD9EE · y72%</text>
  <text x="0" y="132"><tspan fill="#eaf1fb" font-weight="600">SFX:</tspan> soft "ding" @7.2s</text>
  <text x="0" y="156"><tspan fill="#eaf1fb" font-weight="600">CC:</tspan> IMPULSE VAULT pauses you —</text>
  <text x="14" y="176">right at checkout.</text>
</g>

<!-- ===== S4 thumbnail ===== -->
<g transform="translate(1301,118)">
  <text x="0" y="-6" fill="#a9cbff" font-size="17" font-weight="700">S4 · 11.5–15.0s · CTA</text>
  <rect x="0" y="4" width="300" height="500" rx="24" fill="url(#fr)" stroke="rgba(255,255,255,0.12)"/>
  <g transform="translate(150,150)">
    <rect x="-32" y="-32" width="64" height="64" rx="17" fill="url(#tile)"/>
    <circle cx="0" cy="0" r="21" fill="#0a1424"/>
    <circle cx="0" cy="0" r="15" fill="none" stroke="#7fb0ff" stroke-width="3"/>
    <line x1="0" y1="0" x2="10" y2="-10" stroke="#a9cbff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="4" fill="#a9cbff"/>
  </g>
  <text x="150" y="226" fill="#eaf1fb" font-size="21" font-weight="700" letter-spacing="2" text-anchor="middle">IMPULSE VAULT</text>
  <rect x="40" y="262" width="220" height="52" rx="13" fill="url(#tile)"/>
  <text x="150" y="295" fill="#06101f" font-size="15.5" font-weight="700" text-anchor="middle">Add to your browser — Free</text>
  <text x="150" y="352" fill="#eaf3ff" font-size="19" font-weight="700" text-anchor="middle">impursivevault.com</text>
  <text x="150" y="384" fill="#9fb0c6" font-size="13" text-anchor="middle" font-family="'Inter',sans-serif">🔒 100% local · no account</text>
</g>
<g transform="translate(1301,648)" font-family="'Inter',sans-serif" font-size="13" fill="#9fb0c6">
  <text x="0" y="0"><tspan fill="#eaf1fb" font-weight="600">BG:</tspan> dark + brand-mark PNG (≤100%) y28%</text>
  <text x="0" y="24"><tspan fill="#eaf1fb" font-weight="600">L1:</tspan> "IMPULSE VAULT" · 44px · tracking 2 · y36%</text>
  <text x="0" y="48"><tspan fill="#eaf1fb" font-weight="600">L2 button:</tspan> CapCut shape #6EA8FF +</text>
  <text x="14" y="68">"Add to your browser — Free" #06101F 34px y45%</text>
  <text x="0" y="92"><tspan fill="#eaf1fb" font-weight="600">L3:</tspan> "impursivevault.com" 40px #EAF3FF y53%</text>
  <text x="14" y="112">GLOW OFF (keep edges crisp)</text>
  <text x="0" y="136"><tspan fill="#eaf1fb" font-weight="600">Anim:</tspan> logo fade · button pop 0.9→1.0</text>
  <text x="0" y="160"><tspan fill="#eaf1fb" font-weight="600">SFX:</tspan> chime · BGM resolve</text>
  <text x="0" y="180"><tspan fill="#eaf1fb" font-weight="600">CC:</tspan> Free · 100% local → impursivevault.com</text>
</g>

<!-- ===== bottom global panels ===== -->
<line x1="80" y1="900" x2="1600" y2="900" stroke="rgba(255,255,255,0.1)"/>
<g transform="translate(80,936)">
  <text x="0" y="0" fill="#eaf1fb" font-size="17" font-weight="700">ASSETS TO PREP (export PNG at 2× for sharpness)</text>
  <g font-family="'Inter',sans-serif" font-size="13" fill="#9fb0c6">
    <text x="0" y="28">• Brand mark → from <tspan fill="#eaf1fb">fb-profile.svg</tspan> (PNG)</text>
    <text x="0" y="50">• Pause card → crop from <tspan fill="#eaf1fb">ig-ad-square-v1plus.svg</tspan> (PNG)</text>
    <text x="0" y="72">• Background → none needed (CapCut solid #0A0E14)</text>
  </g>
  <text x="540" y="0" fill="#eaf1fb" font-size="17" font-weight="700">AUDIO MAP</text>
  <g font-family="'Inter',sans-serif" font-size="13" fill="#9fb0c6">
    <text x="540" y="28">BGM: "calm / minimal / tension" (CapCut free), builds late</text>
    <text x="540" y="50">SFX: click @0.2s · boom @3.9s · ding @7.2s · chime @11.6s</text>
    <text x="540" y="72">Captions ON (auto-caption then fix), bottom-center</text>
  </g>
  <text x="1060" y="0" fill="#eaf1fb" font-size="17" font-weight="700">EXPORT</text>
  <g font-family="'Inter',sans-serif" font-size="13" fill="#9fb0c6">
    <text x="1060" y="28">1080×1920 · 30fps · bitrate <tspan fill="#eaf1fb">HIGH</tspan> · H.264 / MP4</text>
    <text x="1060" y="50">Enhance / Smart-HDR / AI → <tspan fill="#ff6b6b">OFF</tspan></text>
  </g>
  <text x="1060" y="92" fill="#ffb454" font-size="13" font-weight="700" font-family="'Inter',sans-serif">SHARPNESS: images ≤100% · text = CapCut native</text>
  <text x="1060" y="112" fill="#ffb454" font-size="13" font-weight="700" font-family="'Inter',sans-serif">Transitions: None / Fade / Mix only — never Blur/Glow/Zoom-blur</text>
</g>
