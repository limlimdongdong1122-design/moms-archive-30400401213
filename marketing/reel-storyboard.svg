<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" font-family="'Space Grotesk','Inter',system-ui,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c0e13"/><stop offset="1" stop-color="#070809"/></linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9cbff"/><stop offset="1" stop-color="#6ea8ff"/></linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#171b22"/><stop offset="1" stop-color="#0e1116"/></linearGradient>
  </defs>
  <rect width="1600" height="980" fill="url(#bg)"/>
  <text x="56" y="64" font-size="30" font-weight="700" letter-spacing="2" fill="#eef2f8">IMPULSE VAULT — Reel storyboard <tspan fill="#6ea8ff">(15–22s · 9:16)</tspan></text>
  <text x="56" y="98" font-size="18" fill="#8a93a4">AI b-roll + real screen recording + bold captions. Hook in the first 2 seconds.</text>

  <!-- 5 vertical frames -->
  <!-- frame template positions -->
  <g>
    <!-- F1 -->
    <g transform="translate(56,140)">
      <rect width="270" height="480" rx="18" fill="url(#frame)" stroke="#ffffff" stroke-opacity="0.1"/>
      <circle cx="32" cy="34" r="16" fill="url(#acc)"/><text x="32" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#06101f">1</text>
      <text x="135" y="240" text-anchor="middle" font-size="22" font-weight="700" fill="#eef2f8">0–2s · HOOK</text>
      <text x="135" y="276" text-anchor="middle" font-size="15" fill="#aab3c4">Finger over “Buy now”</text>
      <text x="135" y="298" text-anchor="middle" font-size="15" fill="#aab3c4">at night (AI b-roll)</text>
      <rect x="24" y="410" width="222" height="48" rx="10" fill="#6ea8ff" fill-opacity="0.12"/>
      <text x="135" y="440" text-anchor="middle" font-size="15" font-weight="700" fill="#cfe0ff">“It's not willpower.”</text>
    </g>
    <!-- F2 -->
    <g transform="translate(350,140)">
      <rect width="270" height="480" rx="18" fill="url(#frame)" stroke="#ffffff" stroke-opacity="0.1"/>
      <circle cx="32" cy="34" r="16" fill="url(#acc)"/><text x="32" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#06101f">2</text>
      <text x="135" y="240" text-anchor="middle" font-size="22" font-weight="700" fill="#eef2f8">2–5s · PROBLEM</text>
      <text x="135" y="276" text-anchor="middle" font-size="15" fill="#aab3c4">Unopened delivery box</text>
      <text x="135" y="298" text-anchor="middle" font-size="15" fill="#aab3c4">in messy room (AI b-roll)</text>
      <rect x="24" y="410" width="222" height="48" rx="10" fill="#6ea8ff" fill-opacity="0.12"/>
      <text x="135" y="440" text-anchor="middle" font-size="14" font-weight="700" fill="#cfe0ff">“It's the speed of the moment.”</text>
    </g>
    <!-- F3 -->
    <g transform="translate(644,140)">
      <rect width="270" height="480" rx="18" fill="url(#frame)" stroke="#6ea8ff" stroke-opacity="0.4"/>
      <circle cx="32" cy="34" r="16" fill="url(#acc)"/><text x="32" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#06101f">3</text>
      <text x="135" y="232" text-anchor="middle" font-size="22" font-weight="700" fill="#9cc2ff">5–11s · SOLUTION</text>
      <text x="135" y="268" text-anchor="middle" font-size="15" fill="#aab3c4">REAL screen recording:</text>
      <text x="135" y="290" text-anchor="middle" font-size="15" fill="#aab3c4">extension modal pops up</text>
      <text x="135" y="312" text-anchor="middle" font-size="14" fill="#7fd6a6">(pros/cons + $149)</text>
      <rect x="24" y="410" width="222" height="48" rx="10" fill="#6ea8ff" fill-opacity="0.12"/>
      <text x="135" y="440" text-anchor="middle" font-size="15" font-weight="700" fill="#cfe0ff">“So it adds one.”</text>
    </g>
    <!-- F4 -->
    <g transform="translate(938,140)">
      <rect width="270" height="480" rx="18" fill="url(#frame)" stroke="#ffffff" stroke-opacity="0.1"/>
      <circle cx="32" cy="34" r="16" fill="url(#acc)"/><text x="32" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#06101f">4</text>
      <text x="135" y="240" text-anchor="middle" font-size="22" font-weight="700" fill="#eef2f8">11–15s · PAYOFF</text>
      <text x="135" y="276" text-anchor="middle" font-size="15" fill="#aab3c4">“Vault it” tap →</text>
      <text x="135" y="298" text-anchor="middle" font-size="15" fill="#aab3c4">Total Saved counts up</text>
      <rect x="24" y="410" width="222" height="48" rx="10" fill="#7fd6a6" fill-opacity="0.16"/>
      <text x="135" y="440" text-anchor="middle" font-size="17" font-weight="700" fill="#7fd6a6">“+$149 saved”</text>
    </g>
    <!-- F5 -->
    <g transform="translate(1232,140)">
      <rect width="270" height="480" rx="18" fill="url(#frame)" stroke="url(#acc)" stroke-opacity="0.5"/>
      <circle cx="32" cy="34" r="16" fill="url(#acc)"/><text x="32" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#06101f">5</text>
      <!-- mini vault mark -->
      <g transform="translate(135,235)">
        <path d="M0,-46 L37,-31 V3 C37,30 19,46 0,54 C-19,46 -37,30 -37,3 V-31 Z" fill="#10131b" stroke="url(#acc)" stroke-width="3"/>
        <circle cx="0" cy="2" r="16" fill="none" stroke="url(#acc)" stroke-width="3"/><circle cx="0" cy="2" r="5" fill="url(#acc)"/>
      </g>
      <text x="135" y="332" text-anchor="middle" font-size="22" font-weight="700" fill="#eef2f8">15–22s · END CARD</text>
      <text x="135" y="366" text-anchor="middle" font-size="14" fill="#aab3c4">reel-endcard.svg</text>
      <rect x="24" y="410" width="222" height="48" rx="10" fill="#6ea8ff" fill-opacity="0.12"/>
      <text x="135" y="440" text-anchor="middle" font-size="13" font-weight="700" fill="#cfe0ff">“Free · Link in bio”</text>
    </g>
  </g>

  <text x="56" y="700" font-size="20" font-weight="700" fill="#eef2f8">Tips</text>
  <text x="56" y="734" font-size="16" fill="#aab3c4">• Use a trending audio. • Big bold captions (most watch muted). • Hook text on screen for the full first 2s.</text>
  <text x="56" y="762" font-size="16" fill="#aab3c4">• Keep it ≤ 22s. • End on the card with a clear CTA. • Post 3–5×/week, reuse the same hook.</text>
  <text x="56" y="824" font-size="16" fill="#6b7484">Caption idea:  “I stopped impulse-buying by adding a 3-second pause to my own checkout button. Free, link in bio. #nospend #frugal #impulsebuying”</text>
</svg>
