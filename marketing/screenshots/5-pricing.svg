  <g fill="#6ea8ff" font-size="16" font-weight="700"><text x="36" y="200">✓</text><text x="36" y="244">✓</text><text x="36" y="288">✓</text><text x="36" y="332">✓</text><text x="36" y="376">✓</text></g>
  <rect x="36" y="408" width="308" height="50" rx="13" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)"/>
  <text x="190" y="439" fill="#eaf1fb" font-size="16" font-weight="600" text-anchor="middle">Get started — free</text>
</g>
<!-- PRO -->
<g transform="translate(680,200)">
  <rect width="380" height="480" rx="22" fill="rgba(110,168,255,0.10)" stroke="rgba(110,168,255,0.5)"/>
  <text x="36" y="64" fill="#a9cbff" font-size="14" font-weight="700" letter-spacing="2">PRO</text>
  <text x="36" y="124" fill="#ffffff" font-size="50" font-weight="700">$2.99</text>
  <text x="178" y="124" fill="#6c7c93" font-size="16">/mo · or $24.99/yr</text>
  <g fill="#9fb0c6" font-size="16" font-family="'Inter',sans-serif">
    <text x="60" y="196">Managed AI analysis — no API key</text>
    <text x="60" y="240">Deeper, personalized reads</text>
    <text x="60" y="284">Smarter "wait or buy" guidance</text>
    <text x="60" y="328">Everything in Free</text>
    <text x="60" y="372">Cancel anytime</text>
  </g>
  <g fill="#6ea8ff" font-size="16" font-weight="700"><text x="36" y="196">✓</text><text x="36" y="240">✓</text><text x="36" y="284">✓</text><text x="36" y="328">✓</text><text x="36" y="372">✓</text></g>
