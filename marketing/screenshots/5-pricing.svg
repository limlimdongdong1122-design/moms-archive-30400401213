  <rect width="380" height="480" rx="22" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
  <text x="36" y="64" fill="#a9cbff" font-size="14" font-weight="700" letter-spacing="2">FREE</text>
  <text x="36" y="128" fill="#ffffff" font-size="56" font-weight="700">$0</text>
  <text x="160" y="128" fill="#6c7c93" font-size="16">forever</text>
  <g fill="#9fb0c6" font-size="16" font-family="'Inter',sans-serif">
