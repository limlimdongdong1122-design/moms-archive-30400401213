<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#4f46e5" />
<title>중3-1 수학 튜터</title>
<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --card2:#273449; --ink:#e2e8f0; --sub:#94a3b8;
    --brand:#6366f1; --brand2:#818cf8; --ok:#34d399; --line:#334155;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    line-height:1.6; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap{max-width:560px;margin:0 auto;padding:16px}
  header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  header .logo{font-size:26px}
  header h1{font-size:18px;margin:0}
  header p{margin:0;font-size:12px;color:var(--sub)}

  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .chip{
    border:1px solid var(--line); background:var(--card); color:var(--sub);
    padding:8px 12px;border-radius:999px;font-size:13px;cursor:pointer;user-select:none;
    transition:.15s;
  }
  .chip.active{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}

  .inputbar{display:flex;gap:8px;margin-bottom:8px}
  #q{
    flex:1;background:var(--card);border:1px solid var(--line);color:var(--ink);
    border-radius:12px;padding:14px;font-size:17px;outline:none;
  }
  #q:focus{border-color:var(--brand2)}
  #go{
    background:var(--brand);color:#fff;border:0;border-radius:12px;
    padding:0 18px;font-size:16px;font-weight:700;cursor:pointer;
  }
  #go:active{background:#4f46e5}

  .keys{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .key{
    background:var(--card2);border:1px solid var(--line);color:var(--ink);
    border-radius:8px;padding:8px 11px;font-size:15px;cursor:pointer;min-width:38px;text-align:center
  }
  .key:active{background:var(--brand)}

  .result{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:16px;margin-bottom:14px;display:none;animation:fade .2s ease
  }
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
  .result.show{display:block}
  .badge{display:inline-block;background:#312e81;color:var(--brand2);font-size:12px;
    padding:3px 10px;border-radius:999px;margin-bottom:10px;font-weight:600}
  .answer{font-size:19px;font-weight:800;color:#fff;margin:2px 0 14px;word-break:break-word}
  .answer .lbl{color:var(--ok);font-size:12px;display:block;font-weight:600;margin-bottom:2px}
  .steps{border-top:2px solid var(--brand);padding-top:14px}
  .steps h3{font-size:15px;color:var(--brand2);margin:0 0 10px;font-weight:700}
  .step{background:var(--card2);border-left:3px solid var(--brand);border-radius:10px;
    padding:12px 14px;margin-bottom:9px;font-size:16px;line-height:1.7;white-space:pre-wrap;word-break:break-word}

  .examples{margin-top:6px}
  .examples h3{font-size:13px;color:var(--sub);margin:0 0 8px}
  .ex{display:block;width:100%;text-align:left;background:transparent;border:1px solid var(--line);
    color:var(--ink);border-radius:10px;padding:11px 12px;margin-bottom:7px;font-size:14px;cursor:pointer}
  .ex:active{border-color:var(--brand2);background:var(--card)}
  .hint{font-size:12px;color:var(--sub);margin-top:4px}
  footer{text-align:center;color:var(--sub);font-size:11px;margin-top:20px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">📐</div>
    <div>
      <h1>중3-1 수학 튜터</h1>
      <p>문제를 입력하면 정답과 단계별 풀이를 알려줘요</p>
    </div>
  </header>

  <div class="chips" id="chips">
    <div class="chip active" data-k="auto">자동</div>
    <div class="chip" data-k="radical">제곱근</div>
    <div class="chip" data-k="expand">전개</div>
    <div class="chip" data-k="factor">인수분해</div>
    <div class="chip" data-k="solve">이차방정식</div>
    <div class="chip" data-k="function">이차함수</div>
  </div>

  <div class="inputbar">
    <input id="q" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false"
           placeholder="예) x^2-5x+6=0" />
    <button id="go">풀기</button>
  </div>

  <div class="keys" id="keys">
    <div class="key" data-ins="x">x</div>
    <div class="key" data-ins="^2">x²</div>
    <div class="key" data-ins="^">^</div>
    <div class="key" data-ins="(">(</div>
    <div class="key" data-ins=")">)</div>
    <div class="key" data-ins="+">+</div>
    <div class="key" data-ins="-">−</div>
    <div class="key" data-ins="*">×</div>
    <div class="key" data-ins="=">=</div>
    <div class="key" data-ins="√">√</div>
    <div class="key" data-act="back">⌫</div>
    <div class="key" data-act="clear">C</div>
  </div>

  <div class="result" id="result">
    <span class="badge" id="badge">결과</span>
    <div class="answer"><span class="lbl">✅ 정답</span><span id="answer"></span></div>
    <div class="steps">
      <h3>✍️ 자세한 풀이</h3>
      <div id="steps"></div>
    </div>
  </div>

  <div class="examples">
    <h3>예시 (눌러서 바로 풀기)</h3>
    <button class="ex" data-q="√72" data-k="radical">제곱근 정리 — √72</button>
    <button class="ex" data-q="(2x+1)^2" data-k="expand">전개(곱셈공식) — (2x+1)²</button>
    <button class="ex" data-q="2x^2+7x+3" data-k="factor">인수분해 — 2x²+7x+3</button>
    <button class="ex" data-q="x^2-5x+6=0" data-k="solve">이차방정식 — x²−5x+6=0</button>
    <button class="ex" data-q="x^2-2x-1=0" data-k="solve">이차방정식(무리수근) — x²−2x−1=0</button>
    <button class="ex" data-q="y=x^2-4x+3" data-k="function">이차함수 — y=x²−4x+3</button>
    <p class="hint">표기: 거듭제곱 <b>^</b> (x²는 x^2), 곱셈은 붙여쓰기 가능(2x, 3(x+1)), 제곱근 <b>√</b>.</p>
  </div>

  <footer>중3-1 과정: 제곱근의 계산 · 곱셈공식/인수분해 · 이차방정식 · 이차함수</footer>
</div>

<script src="engine.js"></script>
<script>
(function(){
  var E = window.MathEngine;
  var kind = 'auto';
  var q = document.getElementById('q');
  var result = document.getElementById('result');

  document.getElementById('chips').addEventListener('click', function(e){
    var c = e.target.closest('.chip'); if(!c) return;
    [].forEach.call(this.querySelectorAll('.chip'), function(x){x.classList.remove('active')});
    c.classList.add('active'); kind = c.dataset.k;
    setPlaceholder();
  });

  function setPlaceholder(){
    var ph = {auto:'예) x^2-5x+6=0', radical:'예) √72', expand:'예) (2x+1)^2',
      factor:'예) 2x^2+7x+3', solve:'예) x^2-5x+6=0', function:'예) y=x^2-4x+3'};
    q.placeholder = ph[kind] || '문제를 입력하세요';
  }

  document.getElementById('keys').addEventListener('click', function(e){
    var k = e.target.closest('.key'); if(!k) return;
    if(k.dataset.act === 'back'){ q.value = q.value.slice(0,-1); }
    else if(k.dataset.act === 'clear'){ q.value=''; }
    else { q.value += k.dataset.ins; }
    q.focus();
  });

  function run(){
    var text = q.value.trim();
    if(!text){ q.focus(); return; }
    var r = E.solve(text, kind === 'auto' ? null : kind);
    document.getElementById('badge').textContent = r.title;
    document.getElementById('answer').textContent = r.answer;
    var box = document.getElementById('steps'); box.innerHTML = '';
    r.steps.forEach(function(s){
      var d = document.createElement('div'); d.className='step'; d.textContent = s; box.appendChild(d);
    });
    result.classList.add('show');
    result.scrollIntoView({behavior:'smooth', block:'nearest'});
  }

  document.getElementById('go').addEventListener('click', run);
  q.addEventListener('keydown', function(e){ if(e.key==='Enter') run(); });

  document.querySelector('.examples').addEventListener('click', function(e){
    var b = e.target.closest('.ex'); if(!b) return;
    q.value = b.dataset.q;
    kind = b.dataset.k;
    [].forEach.call(document.querySelectorAll('.chip'), function(x){
      x.classList.toggle('active', x.dataset.k === kind);
    });
    run();
  });

  setPlaceholder();
})();
</script>
</body>
</html>
