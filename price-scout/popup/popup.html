<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PRICE SCOUT</title>
    <link rel="stylesheet" href="../tokens.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <!-- Cinematic atmosphere: slow aurora drift + grain + vignette -->
    <div class="ps-atmosphere" aria-hidden="true">
      <span class="ps-aurora ps-aurora--mint"></span>
      <span class="ps-aurora ps-aurora--teal"></span>
      <span class="ps-grain"></span>
      <span class="ps-vignette"></span>
    </div>

    <div class="wrap">
      <header class="top ps-enter">
        <div class="logo">
          <span class="logo-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <circle cx="11" cy="11" r="7.2" stroke="currentColor" stroke-width="1.8" />
              <circle cx="11" cy="11" r="2.6" fill="currentColor" />
              <path d="M16.2 16.2 21 21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
          </span>
          <span class="logo-name">PRICE&nbsp;SCOUT</span>
        </div>
        <button class="scan-btn" id="scanNow" title="지금 모든 상품의 가격을 정찰합니다">
          <svg class="scan-ico" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-3.5-7.1" />
            <path d="M21 4v5h-5" />
          </svg>
          <span id="scanLabel">정찰</span>
        </button>
      </header>

      <main id="main">
        <!-- Hero: the radar scope + watchlist headline -->
        <section class="hero ps-enter" style="--ps-delay: 60ms">
          <div class="radar-stage" aria-hidden="true">
            <div class="radar-rings"></div>
            <div class="radar-sweep"></div>
            <span class="radar-blip b1"></span>
            <span class="radar-blip b2"></span>
            <span class="radar-core"></span>
          </div>
          <div class="watch-label ps-label">정찰 중인 경쟁 상품</div>
          <div class="watch-count ps-stat-number" id="watchCount">0</div>
          <div class="hairline" aria-hidden="true"></div>
          <div class="hero-meta">
            <div class="meta-cell">
              <b id="threatCount">0</b>
              <span>언더컷 위협</span>
            </div>
            <span class="meta-sep" aria-hidden="true"></span>
            <div class="meta-cell">
              <b id="oppCount">0</b>
              <span>가격 기회</span>
            </div>
          </div>
        </section>

        <!-- Recent competitor moves -->
        <section class="moves-section ps-enter" style="--ps-delay: 120ms">
          <div class="section-head">
            <h2 class="ps-label">최근 변동</h2>
            <span class="count" id="movesCount">0</span>
          </div>
          <div id="movesList" class="moves-list"></div>

          <div class="empty glass" id="movesEmpty" hidden>
            <span class="empty-ico" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="7" />
                <path d="m16.5 16.5 4 4" />
              </svg>
            </span>
            <p>아직 추적 중인 상품이 없어요.<br />경쟁사 상품 페이지에서 우측 하단의 <b>정찰 버튼</b>으로 추가해보세요.</p>
          </div>

          <div class="all-quiet glass" id="allQuiet" hidden>
            <span class="quiet-dot" aria-hidden="true"></span>
            <p>지금은 조용해요. 마지막 정찰 이후 가격 변동이 없습니다.</p>
          </div>
        </section>

        <footer class="foot ps-enter" style="--ps-delay: 180ms">
          <button class="btn-ghost" id="openDash">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 19V5M4 19h16M8 16v-5M12 16V8M16 16v-3" />
            </svg>
            <span>대시보드 · 가격 추이</span>
          </button>
          <button class="btn-ghost icon-only" id="openSettings" title="설정" aria-label="설정">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3" />
              <path d="M12 2.5v2.2M12 19.3v2.2M21.5 12h-2.2M4.7 12H2.5M18.4 5.6l-1.5 1.5M7.1 16.9l-1.5 1.5M18.4 18.4l-1.5-1.5M7.1 7.1 5.6 5.6" />
            </svg>
          </button>
        </footer>
      </main>
    </div>

    <script src="../utils/price.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
