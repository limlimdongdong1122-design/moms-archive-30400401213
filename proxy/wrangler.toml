# IMPULSE VAULT AI proxy — Cloudflare Worker config
# Deploy:  npm i -g wrangler  →  wrangler login  →  wrangler deploy
name = "impulse-vault-proxy"
main = "worker.js"
compatibility_date = "2024-11-01"

# Tunable limits + provider selection (safe to commit — NOT secrets).
[vars]
PROVIDER = "claude"        # "claude" | "openai"
MODEL = ""                 # blank = provider default (claude-sonnet-4-6 / gpt-4o-mini)
DAILY_PER_IP = "20"        # max AI calls per IP per day
DAILY_GLOBAL = "2000"      # max AI calls across everyone per day (your cost ceiling)
ALLOW_ORIGIN = "*"         # tighten to your extension id later if you want

# Rate-limit counters live in KV. Create one and paste its id:
#   wrangler kv:namespace create IV_KV   →   copy the id below
[[kv_namespaces]]
binding = "IV_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# Secrets are NOT stored here. Set them with:
#   wrangler secret put ANTHROPIC_API_KEY
#   wrangler secret put OPENAI_API_KEY      (only if PROVIDER=openai)
#   wrangler secret put SHARED_SECRET       (optional bot deterrent)
